
name: Construire RUN COACH APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Decompresser le projet
        run: unzip RUN-COACH-Android(1).zip -d .

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer les composants Android
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compiler RUN COACH
        working-directory: run-coach
        run: gradle assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: RUN-COACH-APK
          path: run-coach/app/build/outputs/apk/debug/app-debug.apk
          
